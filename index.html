<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Grid Build-Up</title>
  <style>
    :root {
      --surface: #2a2a2a;
      --surface-raised: #333333;
      --surface-inner: #3d3d3d;
      --muted: #555555;
      --muted-light: #6a6a6a;
      --line: #4a4a4a;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --grow: 0.75s;
      --shift: 0.7s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #222 0%, transparent 70%),
        linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      padding: 2rem;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 80px,
        rgba(255, 255, 255, 0.015) 80px,
        rgba(255, 255, 255, 0.015) 81px
      );
      pointer-events: none;
    }

    .stage {
      width: min(920px, 96vw);
      position: relative;
      z-index: 1;
    }

    .dashboard {
      background: var(--surface);
      border-radius: 28px;
      padding: 22px 24px 24px;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: scale(0.94) translateY(20px);
      transition:
        opacity 0.65s var(--ease),
        transform 0.65s var(--ease);
    }

    .dashboard.is-in {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* —— Header —— */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .search {
      flex: 1;
      height: 28px;
      border-radius: 999px;
      background: var(--surface-raised);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      min-width: 0;
      transform-origin: left center;
    }

    .search-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      width: 36px;
      height: 22px;
      border-radius: 999px;
      background: var(--surface-raised);
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      padding-left: 0;
      max-width: 100%;
      transition: padding-left var(--shift) var(--ease);
    }

    .dashboard.has-left .tabs {
      padding-left: calc(33.333% + 12px);
    }

    .tab {
      flex: 0 1 0;
      height: 28px;
      border-radius: 999px;
      background: var(--surface-raised);
      max-width: 110px;
      opacity: 0;
      transform: scaleX(0.2);
      transform-origin: left center;
      transition:
        flex-grow var(--grow) var(--ease),
        opacity 0.45s var(--ease),
        transform 0.55s var(--ease);
    }

    .tab.is-in {
      flex: 1 1 0;
      opacity: 1;
      transform: scaleX(1);
    }

    /* —— Grid: columns grow & shove each other —— */
    .grid {
      display: grid;
      grid-template-columns: 0fr 0fr 0fr;
      gap: 14px;
      min-height: 420px;
      align-items: stretch;
      transition: grid-template-columns var(--shift) var(--ease);
    }

    .grid.show-left {
      grid-template-columns: 1fr 0fr 0fr;
    }

    .grid.show-left.show-mid {
      grid-template-columns: 1fr 1.15fr 0fr;
    }

    .grid.show-left.show-mid.show-right {
      grid-template-columns: 1fr 1.15fr 1fr;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .col-slot {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--grow) var(--ease);
      min-height: 0;
    }

    .col-slot + .col-slot {
      margin-top: 0;
      transition:
        grid-template-rows var(--grow) var(--ease),
        margin-top var(--grow) var(--ease);
    }

    .col-slot.is-open {
      grid-template-rows: 1fr;
    }

    .col-slot.is-open + .col-slot.is-open {
      margin-top: 14px;
    }

    .col-slot > .card {
      min-height: 0;
      overflow: hidden;
    }

    .card {
      background: var(--surface-raised);
      border-radius: 22px;
      padding: 16px;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      opacity: 0;
      transform: scale(0.72);
      transform-origin: center center;
      transition:
        opacity 0.5s var(--ease),
        transform var(--grow) var(--ease),
        border-radius 0.5s var(--ease);
      will-change: transform, opacity;
    }

    .card.is-grown {
      opacity: 1;
      transform: scale(1);
    }

    /* Left feature */
    .feature {
      display: flex;
      flex-direction: column;
      padding: 18px;
      height: 420px;
    }

    .feature-inner {
      flex: 1;
      background: var(--surface-inner);
      border-radius: 18px;
      position: relative;
      margin-bottom: 18px;
      opacity: 0;
      transform: scale(0.9);
      transition:
        opacity 0.5s var(--ease),
        transform 0.55s var(--ease);
    }

    .feature-inner.is-in {
      opacity: 1;
      transform: scale(1);
    }

    .feature-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 18px;
      border-radius: 999px;
      background: var(--muted);
    }

    .feature-dot {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted-light);
    }

    .feature-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }

    .feature-footer.is-in {
      opacity: 1;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Middle */
    .mid-top {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 222px;
    }

    .lines {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .line {
      height: 10px;
      border-radius: 999px;
      background: var(--line);
      transform-origin: left center;
    }

    .line.w60 { width: 60%; }
    .line.w40 { width: 40%; }
    .line.w80 { width: 80%; }
    .line.w50 { width: 50%; }
    .line.w70 { width: 70%; }
    .line.w90 { width: 90%; }
    .line.w100 { width: 100%; }
    .line.thick {
      height: 14px;
      background: var(--muted);
    }

    .cta-pill {
      width: 72px;
      height: 26px;
      border-radius: 999px;
      background: var(--muted);
      margin-top: auto;
    }

    .mid-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
      height: 184px;
    }

    .list-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .list-label {
      width: 48px;
      height: 16px;
      border-radius: 999px;
      background: var(--muted);
      margin-bottom: 6px;
    }

    .toggle-panel {
      background: var(--surface-inner);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      opacity: 0;
      transform: scale(0.85);
      transition:
        opacity 0.45s var(--ease),
        transform 0.5s var(--ease);
    }

    .toggle-panel.is-in {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-face {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--surface-raised);
    }

    .toggle {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: var(--muted);
      position: relative;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #c8c8c8;
    }

    /* Right */
    .right-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 131px;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .label-pill {
      width: 52px;
      height: 16px;
      border-radius: 999px;
      background: var(--muted);
    }

    .icon-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--muted-light);
      flex-shrink: 0;
    }

    .avatar-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }

    .avatar-sm {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
    }

    .stack-icon {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
    }

    .stack-icon span {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--muted);
      border: 2px solid var(--surface-raised);
    }

    .stack-icon span:nth-child(1) {
      bottom: 0;
      right: 0;
      opacity: 0.45;
      transform: rotate(-12deg);
    }

    .stack-icon span:nth-child(2) {
      bottom: 2px;
      right: 4px;
      opacity: 0.7;
      transform: rotate(-4deg);
    }

    .stack-icon span:nth-child(3) {
      bottom: 4px;
      right: 8px;
      background: var(--muted-light);
    }

    /* Soft detail fades */
    .anim {
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      transition:
        opacity 0.4s var(--ease),
        transform 0.45s var(--ease);
    }

    .anim.is-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .anim.pop {
      transform: scale(0.6);
    }

    .anim.pop.is-in {
      transform: scale(1);
    }

    .anim.grow-x {
      transform: scaleX(0.15);
      transform-origin: left center;
    }

    .anim.grow-x.is-in {
      transform: scaleX(1);
    }

    .replay {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      appearance: none;
      border: none;
      background: #3a3a3a;
      color: #bbb;
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, background 0.2s ease, color 0.2s ease;
    }

    .replay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay:hover {
      background: #4a4a4a;
      color: #eee;
    }

    @media (max-width: 720px) {
      body { padding: 1rem; }
      .dashboard { padding: 14px; border-radius: 20px; }
      .dashboard.has-left .tabs { padding-left: 0; }
      .tabs { flex-wrap: wrap; }
      .grid,
      .grid.show-left,
      .grid.show-left.show-mid,
      .grid.show-left.show-mid.show-right {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .feature { height: 280px; }
      .mid-top { height: 160px; }
      .mid-bottom { height: auto; min-height: 140px; }
      .right-card { height: auto; min-height: 110px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="dashboard" id="dashboard">
      <header class="topbar">
        <div class="logo anim pop" data-step="header"></div>
        <div class="search anim grow-x" data-step="header">
          <div class="search-icon anim pop" data-step="header-inner"></div>
        </div>
        <div class="top-actions">
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="avatar anim pop" data-step="header"></div>
        </div>
      </header>

      <nav class="tabs">
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
      </nav>

      <div class="grid" id="grid">
        <!-- Left -->
        <div class="col" data-col="left">
          <div class="col-slot" data-slot="left-0">
            <article class="card feature" data-card="feature">
              <div class="feature-inner" data-step="col-left-inner">
                <div class="feature-badge anim pop" data-step="col-left-bits"></div>
                <div class="feature-dot anim pop" data-step="col-left-bits"></div>
              </div>
              <div class="feature-footer" data-step="col-left-bits">
                <div class="dot"></div>
                <div class="dot"></div>
              </div>
            </article>
          </div>
        </div>

        <!-- Middle -->
        <div class="col" data-col="mid">
          <div class="col-slot" data-slot="mid-0">
            <article class="card mid-top" data-card="mid-top">
              <div class="lines">
                <div class="line w60 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w40 anim grow-x" data-step="col-mid-inner"></div>
              </div>
              <div class="cta-pill anim pop" data-step="col-mid-inner"></div>
            </article>
          </div>
          <div class="col-slot" data-slot="mid-1">
            <article class="card mid-bottom" data-card="mid-bottom">
              <div class="list-block">
                <div class="list-label anim pop" data-step="col-mid-inner"></div>
                <div class="line w90 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w70 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w80 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w50 anim grow-x" data-step="col-mid-inner"></div>
              </div>
              <div class="toggle-panel" data-step="col-mid-inner">
                <div class="toggle-face anim pop" data-step="col-mid-bits"></div>
                <div class="toggle anim pop" data-step="col-mid-bits"></div>
              </div>
            </article>
          </div>
        </div>

        <!-- Right -->
        <div class="col" data-col="right">
          <div class="col-slot" data-slot="right-0">
            <article class="card right-card" data-card="right-0">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w70 anim grow-x" data-step="col-right-inner"></div>
                <div class="line w50 anim grow-x" data-step="col-right-inner"></div>
              </div>
              <div class="avatar-row">
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
              </div>
            </article>
          </div>
          <div class="col-slot" data-slot="right-1">
            <article class="card right-card" data-card="right-1">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w60 anim grow-x" data-step="col-right-inner"></div>
                <div class="line thick w100 anim grow-x" data-step="col-right-inner"></div>
              </div>
            </article>
          </div>
          <div class="col-slot" data-slot="right-2">
            <article class="card right-card" data-card="right-2">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w80 anim grow-x" data-step="col-right-inner"></div>
                <div class="line anim grow-x" data-step="col-right-inner" style="width:45%"></div>
              </div>
              <div class="stack-icon anim pop" data-step="col-right-bits">
                <span></span><span></span><span></span>
              </div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="replay" id="replay" type="button">Replay</button>

  <script>
    const dashboard = document.getElementById("dashboard");
    const grid = document.getElementById("grid");
    const replayBtn = document.getElementById("replay");
    const SHIFT_MS = 700;
    const GROW_MS = 750;

    let timers = [];
    let flipRaf = 0;

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
      cancelAnimationFrame(flipRaf);
    }

    function wait(ms) {
      return new Promise((resolve) => {
        const id = setTimeout(resolve, ms);
        timers.push(id);
      });
    }

    /** Snapshot positions of all grown cards for FLIP */
    function measureCards() {
      const map = new Map();
      document.querySelectorAll(".card.is-grown").forEach((el) => {
        map.set(el, el.getBoundingClientRect());
      });
      return map;
    }

    /**
     * After a layout change, invert grown cards back to their
     * previous rects, then play them into the new positions.
     * This is what makes neighbors feel like they shove each other.
     */
    function flipFrom(firstRects) {
      const lasts = measureCards();
      const playing = [];

      lasts.forEach((last, el) => {
        const first = firstRects.get(el);
        if (!first) return;

        const dx = first.left - last.left;
        const dy = first.top - last.top;
        const sx = first.width / Math.max(last.width, 1);
        const sy = first.height / Math.max(last.height, 1);

        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 &&
            Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) {
          return;
        }

        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
        playing.push(el);
      });

      // Force reflow, then animate to resting transform
      void grid.offsetWidth;

      playing.forEach((el) => {
        el.style.transition =
          `transform ${SHIFT_MS}ms cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1)`;
        el.style.transform = "translate(0, 0) scale(1)";
      });

      // Cleanup inline styles after the shift settles
      const cleanup = setTimeout(() => {
        playing.forEach((el) => {
          el.style.transition = "";
          el.style.transform = "";
        });
      }, SHIFT_MS + 40);
      timers.push(cleanup);
    }

    /** Open a slot (grow height) and grow the card inside, FLIP-shifting siblings */
    async function growCard(slotSelector, { delay = 0 } = {}) {
      if (delay) await wait(delay);

      const slot = document.querySelector(slotSelector);
      const card = slot.querySelector(".card");
      const first = measureCards();

      slot.classList.add("is-open");
      // Next frame so the 0fr → 1fr transition and FLIP both kick in
      await new Promise((r) => {
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => {
            card.classList.add("is-grown");
            flipFrom(first);
            r();
          });
        });
      });

      await wait(GROW_MS * 0.55);
    }

    /** Expand a grid column; existing cards FLIP-shift sideways */
    async function showColumn(name, { delay = 0 } = {}) {
      if (delay) await wait(delay);
      const first = measureCards();
      grid.classList.add(`show-${name}`);
      if (name === "left") dashboard.classList.add("has-left");

      await new Promise((r) => {
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => {
            flipFrom(first);
            r();
          });
        });
      });

      await wait(SHIFT_MS * 0.45);
    }

    async function revealStep(step, stagger = 0) {
      const nodes = [...document.querySelectorAll(`[data-step="${step}"]`)];
      for (let i = 0; i < nodes.length; i++) {
        nodes[i].classList.add("is-in");
        if (stagger && i < nodes.length - 1) await wait(stagger);
      }
    }

    function reset() {
      clearTimers();
      dashboard.classList.remove("is-in", "has-left");
      grid.classList.remove("show-left", "show-mid", "show-right");
      document.querySelectorAll(".col-slot").forEach((el) => el.classList.remove("is-open"));
      document.querySelectorAll(".card").forEach((el) => {
        el.classList.remove("is-grown");
        el.style.transition = "";
        el.style.transform = "";
      });
      document.querySelectorAll(".anim, .tab, .feature-inner, .feature-footer, .toggle-panel")
        .forEach((el) => el.classList.remove("is-in"));
      replayBtn.classList.remove("visible");
    }

    async function play() {
      reset();
      await wait(60);

      // 1 — Shell
      dashboard.classList.add("is-in");
      await wait(420);

      // 2 — Header
      await revealStep("header", 65);
      await wait(100);
      await revealStep("header-inner", 40);
      await wait(220);

      // 3 — Tabs grow across
      await revealStep("tabs", 70);
      await wait(280);

      // 4 — Left column opens, feature card grows to fill
      await showColumn("left");
      await growCard('[data-slot="left-0"]');
      await wait(120);
      await revealStep("col-left-inner");
      await wait(140);
      await revealStep("col-left-bits", 55);
      await wait(220);

      // 5 — Middle column shoves left aside; cards stack & grow
      await showColumn("mid");
      await growCard('[data-slot="mid-0"]');
      await wait(80);
      // Mid-bottom arrives and pushes mid-top upward
      await growCard('[data-slot="mid-1"]');
      await wait(100);
      await revealStep("col-mid-inner", 40);
      await wait(100);
      await revealStep("col-mid-bits", 45);
      await wait(200);

      // 6 — Right column squeezes in; three cards cascade downward
      await showColumn("right");
      await growCard('[data-slot="right-0"]');
      await growCard('[data-slot="right-1"]', { delay: 70 });
      await growCard('[data-slot="right-2"]', { delay: 70 });
      await wait(100);
      await revealStep("col-right-inner", 35);
      await wait(90);
      await revealStep("col-right-bits", 40);

      await wait(520);
      replayBtn.classList.add("visible");
    }

    replayBtn.addEventListener("click", play);

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", play);
    } else {
      play();
    }
  </script>
</body>
</html>
