<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Grid Build-Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --surface: #2a2a2a;
      --surface-raised: #333333;
      --surface-inner: #3d3d3d;
      --muted: #555555;
      --muted-light: #6a6a6a;
      --line: #4a4a4a;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --grow: 0.75s;
      --shift: 0.7s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #222 0%, transparent 70%),
        linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      padding: clamp(0.75rem, 3vw, 2rem);
      padding-bottom: 5rem;
      transition: background 1.2s var(--ease);
    }

    body.is-gray {
      background: linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
    }

    body.is-gray::before {
      opacity: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 80px,
        rgba(255, 255, 255, 0.015) 80px,
        rgba(255, 255, 255, 0.015) 81px
      );
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .stage {
      --gap: clamp(10px, 1.6cqw, 14px);
      --pad: clamp(12px, 2.2cqw, 24px);
      --radius: clamp(18px, 2.5cqw, 28px);
      --card-radius: clamp(16px, 2cqw, 22px);
      --feature-h: clamp(240px, 48cqw, 420px);
      --mid-top-h: clamp(150px, 28cqw, 222px);
      --mid-bottom-h: clamp(140px, 24cqw, 184px);
      --right-h: clamp(110px, 18cqw, 131px);

      width: min(920px, 100%);
      max-width: 100%;
      position: relative;
      z-index: 1;
      container-type: inline-size;
      container-name: stage;
      transition: width 0.85s var(--ease);
      margin-inline: auto;
    }

    .stage.is-morphing {
      transition: width 0.85s var(--ease);
    }

    .dashboard {
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--pad);
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: scale(0.94) translateY(20px);
      transition:
        opacity 0.65s var(--ease),
        transform 0.65s var(--ease),
        border-radius var(--shift) var(--ease),
        padding var(--shift) var(--ease);
    }

    .dashboard.is-in {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Lock to desktop frame height; overflow scrolls inside */
    .dashboard.is-locked {
      height: var(--frame-h);
      max-height: var(--frame-h);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
      scroll-behavior: auto;
    }

    .dashboard.is-locked::-webkit-scrollbar {
      width: 6px;
    }

    .dashboard.is-locked::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 999px;
    }

    /* Closing: UI collapses toward the question */
    .dashboard.is-closing {
      overflow: hidden;
      pointer-events: none;
      transform: scale(0.42);
      opacity: 0;
      filter: blur(10px);
      transition:
        transform 1.1s var(--ease),
        opacity 0.9s ease 0.15s,
        filter 1s ease,
        border-radius 1s var(--ease);
      border-radius: 40px;
    }

    .dashboard.is-closing .card {
      transform: scale(0.85);
      opacity: 0.35;
      transition:
        transform 0.8s var(--ease),
        opacity 0.7s ease;
    }

    .end-title {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 1.5rem;
    }

    .end-title h1 {
      margin: 0;
      text-align: center;
      white-space: nowrap;
      font-family: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.05rem, 3.8vw, 3.25rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #e8e8e8;
      opacity: 0;
      transform: scale(0.82) translateY(18px);
      filter: blur(8px);
      transition:
        opacity 0.9s var(--ease),
        transform 1.1s var(--ease),
        filter 1s var(--ease),
        color 1.2s ease;
    }

    .end-title.is-in h1 {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    .end-title.is-in h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.45em) scale(0.9);
      transition:
        opacity 0.45s var(--ease),
        transform 0.55s var(--ease);
    }

    .end-title.is-in h1 .char.is-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .end-title.is-in h1 .char.space {
      width: 0.28em;
    }

    .end-title.to-gray h1 {
      color: #3a3a3a;
      opacity: 0;
      transform: scale(1.04);
      filter: blur(4px);
      transition:
        opacity 1.1s ease,
        transform 1.2s var(--ease),
        filter 1s ease,
        color 1s ease;
    }

    .gray-veil {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.25s ease;
    }

    .gray-veil.is-in {
      opacity: 1;
    }

    .stage.is-closing {
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity 0.7s ease 0.2s,
        transform 0.9s var(--ease);
    }

    /* —— Header —— */
    .topbar {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      margin-bottom: clamp(12px, 2vw, 16px);
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .search {
      flex: 1;
      height: 28px;
      border-radius: 999px;
      background: var(--surface-raised);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      min-width: 0;
      transform-origin: left center;
    }

    .search-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      width: 36px;
      height: 22px;
      border-radius: 999px;
      background: var(--surface-raised);
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--muted);
    }

    .tabs {
      display: flex;
      gap: clamp(6px, 1.2vw, 10px);
      margin-bottom: clamp(12px, 2vw, 18px);
      padding-left: 0;
      max-width: 100%;
      transition: padding-left var(--shift) var(--ease);
    }

    .dashboard.has-left .tabs {
      padding-left: calc(33.333% + var(--gap));
    }

    .tab {
      flex: 0 1 0;
      height: clamp(22px, 3.5vw, 28px);
      border-radius: 999px;
      background: var(--surface-raised);
      max-width: 110px;
      opacity: 0;
      transform: scaleX(0.2);
      transform-origin: left center;
      transition:
        flex-grow var(--grow) var(--ease),
        opacity 0.45s var(--ease),
        transform 0.55s var(--ease);
    }

    .tab.is-in {
      flex: 1 1 0;
      opacity: 1;
      transform: scaleX(1);
    }

    /* —— Grid: columns grow & shove each other —— */
    .grid {
      display: grid;
      grid-template-columns: 0fr 0fr 0fr;
      gap: var(--gap);
      min-height: var(--feature-h);
      align-items: stretch;
      transition:
        grid-template-columns var(--shift) var(--ease),
        gap var(--shift) var(--ease),
        min-height var(--shift) var(--ease);
    }

    .grid.show-left {
      grid-template-columns: 1fr 0fr 0fr;
    }

    .grid.show-left.show-mid {
      grid-template-columns: 1fr 1.15fr 0fr;
    }

    .grid.show-left.show-mid.show-right {
      grid-template-columns: 1fr 1.15fr 1fr;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .col-slot {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--grow) var(--ease);
      min-height: 0;
    }

    .col-slot + .col-slot {
      margin-top: 0;
      transition:
        grid-template-rows var(--grow) var(--ease),
        margin-top var(--grow) var(--ease);
    }

    .col-slot.is-open {
      grid-template-rows: 1fr;
    }

    .col-slot.is-open + .col-slot.is-open {
      margin-top: var(--gap);
    }

    .col-slot > .card {
      min-height: 0;
      overflow: hidden;
    }

    .card {
      background: var(--surface-raised);
      border-radius: var(--card-radius);
      padding: clamp(12px, 2vw, 16px);
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      opacity: 0;
      transform: scale(0.72);
      transform-origin: center center;
      transition:
        opacity 0.5s var(--ease),
        transform var(--grow) var(--ease),
        border-radius var(--shift) var(--ease),
        padding var(--shift) var(--ease),
        height var(--shift) var(--ease);
      will-change: transform, opacity;
    }

    .card.is-grown {
      opacity: 1;
      transform: scale(1);
    }

    /* Left feature */
    .feature {
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2vw, 18px);
      height: var(--feature-h);
    }

    .feature-inner {
      flex: 1;
      background: var(--surface-inner);
      border-radius: 18px;
      position: relative;
      margin-bottom: 18px;
      opacity: 0;
      transform: scale(0.9);
      transition:
        opacity 0.5s var(--ease),
        transform 0.55s var(--ease);
    }

    .feature-inner.is-in {
      opacity: 1;
      transform: scale(1);
    }

    .feature-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 18px;
      border-radius: 999px;
      background: var(--muted);
    }

    .feature-dot {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted-light);
    }

    .feature-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }

    .feature-footer.is-in {
      opacity: 1;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Middle */
    .mid-top {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: var(--mid-top-h);
    }

    .lines {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .line {
      height: 10px;
      border-radius: 999px;
      background: var(--line);
      transform-origin: left center;
    }

    .line.w60 { width: 60%; }
    .line.w40 { width: 40%; }
    .line.w80 { width: 80%; }
    .line.w50 { width: 50%; }
    .line.w70 { width: 70%; }
    .line.w90 { width: 90%; }
    .line.w100 { width: 100%; }
    .line.thick {
      height: 14px;
      background: var(--muted);
    }

    .cta-pill {
      width: 72px;
      height: 26px;
      border-radius: 999px;
      background: var(--muted);
      margin-top: auto;
    }

    .mid-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 1.5vw, 12px);
      padding: clamp(10px, 1.8vw, 14px);
      height: var(--mid-bottom-h);
    }

    .list-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }

    .list-label {
      width: 48px;
      height: 16px;
      border-radius: 999px;
      background: var(--muted);
      margin-bottom: 6px;
    }

    .toggle-panel {
      background: var(--surface-inner);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      opacity: 0;
      transform: scale(0.85);
      transition:
        opacity 0.45s var(--ease),
        transform 0.5s var(--ease);
    }

    .toggle-panel.is-in {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-face {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--surface-raised);
    }

    .toggle {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: var(--muted);
      position: relative;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #c8c8c8;
    }

    /* Right */
    .right-card {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vw, 12px);
      height: var(--right-h);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .label-pill {
      width: 52px;
      height: 16px;
      border-radius: 999px;
      background: var(--muted);
    }

    .icon-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--muted-light);
      flex-shrink: 0;
    }

    .avatar-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }

    .avatar-sm {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
    }

    .stack-icon {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
    }

    .stack-icon span {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--muted);
      border: 2px solid var(--surface-raised);
    }

    .stack-icon span:nth-child(1) {
      bottom: 0;
      right: 0;
      opacity: 0.45;
      transform: rotate(-12deg);
    }

    .stack-icon span:nth-child(2) {
      bottom: 2px;
      right: 4px;
      opacity: 0.7;
      transform: rotate(-4deg);
    }

    .stack-icon span:nth-child(3) {
      bottom: 4px;
      right: 8px;
      background: var(--muted-light);
    }

    /* Soft detail fades */
    .anim {
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      transition:
        opacity 0.4s var(--ease),
        transform 0.45s var(--ease);
    }

    .anim.is-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .anim.pop {
      transform: scale(0.6);
    }

    .anim.pop.is-in {
      transform: scale(1);
    }

    .anim.grow-x {
      transform: scaleX(0.15);
      transform-origin: left center;
    }

    .anim.grow-x.is-in {
      transform: scaleX(1);
    }

    .replay {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      appearance: none;
      border: none;
      background: #3a3a3a;
      color: #bbb;
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, background 0.2s ease, color 0.2s ease;
    }

    body.is-gray .replay.visible {
      background: #2a2a2a;
      color: #bbb;
    }

    body.is-gray .replay.visible:hover {
      background: #333;
      color: #eee;
    }

    .replay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay:hover {
      background: #4a4a4a;
      color: #eee;
    }

    .size-label {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 10;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      background: rgba(40, 40, 40, 0.85);
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s var(--ease);
    }

    .size-label.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Size-driven layouts (animated big → mid → small → mid → big) —— */
    .stage[data-size="mid"] .dashboard.has-left .tabs {
      padding-left: 0;
    }

    .stage[data-size="mid"] .tabs {
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stage[data-size="mid"] .tabs::-webkit-scrollbar {
      display: none;
    }

    .stage[data-size="mid"] .tab {
      flex: 1 0 auto;
      min-width: 56px;
      max-width: none;
    }

    .stage[data-size="mid"] .grid {
      min-height: 0;
    }

    .stage[data-size="mid"] .grid.show-left,
    .stage[data-size="mid"] .grid.show-left.show-mid,
    .stage[data-size="mid"] .grid.show-left.show-mid.show-right {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "left left"
        "mid right";
    }

    .stage[data-size="mid"] .grid.show-left:not(.show-mid) {
      grid-template-columns: 1fr;
      grid-template-areas: "left";
    }

    .stage[data-size="mid"] .grid.show-left.show-mid:not(.show-right) {
      grid-template-columns: 1fr;
      grid-template-areas:
        "left"
        "mid";
    }

    .stage[data-size="mid"] .col[data-col="left"] { grid-area: left; }
    .stage[data-size="mid"] .col[data-col="mid"] { grid-area: mid; }
    .stage[data-size="mid"] .col[data-col="right"] { grid-area: right; }

    .stage[data-size="mid"] {
      --feature-h: clamp(200px, 42cqw, 280px);
      --mid-top-h: clamp(140px, 30cqw, 180px);
    }

    .stage[data-size="mid"] .mid-bottom {
      height: auto;
      min-height: 130px;
    }

    .stage[data-size="mid"] .right-card {
      height: auto;
      min-height: 100px;
    }

    .stage[data-size="mid"] .top-actions .pill-btn:nth-child(1),
    .stage[data-size="mid"] .top-actions .pill-btn:nth-child(2) {
      display: none;
    }

    .stage[data-size="small"] {
      --feature-h: clamp(220px, 72cqw, 300px);
      --pad: 12px;
      --gap: 10px;
    }

    .stage[data-size="small"] .topbar {
      gap: 8px;
    }

    .stage[data-size="small"] .search {
      height: 26px;
    }

    .stage[data-size="small"] .dashboard.has-left .tabs {
      padding-left: 0;
    }

    .stage[data-size="small"] .tabs {
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stage[data-size="small"] .tabs::-webkit-scrollbar {
      display: none;
    }

    .stage[data-size="small"] .tab {
      flex: 1 0 auto;
      min-width: 44px;
      max-width: none;
      height: 22px;
    }

    .stage[data-size="small"] .tab:nth-child(n + 5) {
      display: none;
    }

    .stage[data-size="small"] .grid,
    .stage[data-size="small"] .grid.show-left,
    .stage[data-size="small"] .grid.show-left.show-mid,
    .stage[data-size="small"] .grid.show-left.show-mid.show-right {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-height: 0;
      grid-template-columns: none;
      grid-template-areas: none;
    }

    .stage[data-size="small"] .col {
      display: contents;
    }

    .stage[data-size="small"] .col-slot:not(.is-open) {
      display: none;
    }

    .stage[data-size="small"] .col-slot.is-open {
      display: block;
      width: 100%;
      margin-top: 0;
    }

    .stage[data-size="small"] .col-slot.is-open + .col-slot.is-open {
      margin-top: 0;
    }

    .stage[data-size="small"] .col-slot {
      grid-template-rows: none;
    }

    .stage[data-size="small"] .col-slot > .card {
      overflow: visible;
    }

    .stage[data-size="small"] .mid-top {
      height: 150px;
    }

    .stage[data-size="small"] .mid-bottom {
      height: auto;
      min-height: 148px;
      grid-template-columns: 1.1fr 0.9fr;
    }

    .stage[data-size="small"] .right-card {
      height: auto;
      min-height: 108px;
    }

    .stage[data-size="small"] .toggle-face {
      width: 48px;
      height: 48px;
    }

    .stage[data-size="small"] .top-actions .pill-btn {
      display: none;
    }

    .stage[data-size="small"] .top-actions .pill-btn:nth-child(3) {
      display: block;
    }

    /* True viewport: keep frame centered on real phones */
    @media (max-width: 540px) {
      body {
        place-items: center;
        padding: 0.75rem;
        padding-bottom: 5.5rem;
      }

      .replay {
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="size-label" id="sizeLabel">Desktop</div>
  <div class="gray-veil" id="grayVeil" aria-hidden="true"></div>
  <div class="end-title" id="endTitle" aria-hidden="true">
    <h1 id="endHeadline"></h1>
  </div>

  <div class="stage" id="stage" data-size="big">
    <div class="dashboard" id="dashboard">
      <header class="topbar">
        <div class="logo anim pop" data-step="header"></div>
        <div class="search anim grow-x" data-step="header">
          <div class="search-icon anim pop" data-step="header-inner"></div>
        </div>
        <div class="top-actions">
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="pill-btn anim pop" data-step="header"></div>
          <div class="avatar anim pop" data-step="header"></div>
        </div>
      </header>

      <nav class="tabs">
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
        <div class="tab" data-step="tabs"></div>
      </nav>

      <div class="grid" id="grid">
        <!-- Left -->
        <div class="col" data-col="left">
          <div class="col-slot" data-slot="left-0">
            <article class="card feature" data-card="feature">
              <div class="feature-inner" data-step="col-left-inner">
                <div class="feature-badge anim pop" data-step="col-left-bits"></div>
                <div class="feature-dot anim pop" data-step="col-left-bits"></div>
              </div>
              <div class="feature-footer" data-step="col-left-bits">
                <div class="dot"></div>
                <div class="dot"></div>
              </div>
            </article>
          </div>
        </div>

        <!-- Middle -->
        <div class="col" data-col="mid">
          <div class="col-slot" data-slot="mid-0">
            <article class="card mid-top" data-card="mid-top">
              <div class="lines">
                <div class="line w60 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w40 anim grow-x" data-step="col-mid-inner"></div>
              </div>
              <div class="cta-pill anim pop" data-step="col-mid-inner"></div>
            </article>
          </div>
          <div class="col-slot" data-slot="mid-1">
            <article class="card mid-bottom" data-card="mid-bottom">
              <div class="list-block">
                <div class="list-label anim pop" data-step="col-mid-inner"></div>
                <div class="line w90 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w70 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w80 anim grow-x" data-step="col-mid-inner"></div>
                <div class="line w50 anim grow-x" data-step="col-mid-inner"></div>
              </div>
              <div class="toggle-panel" data-step="col-mid-inner">
                <div class="toggle-face anim pop" data-step="col-mid-bits"></div>
                <div class="toggle anim pop" data-step="col-mid-bits"></div>
              </div>
            </article>
          </div>
        </div>

        <!-- Right -->
        <div class="col" data-col="right">
          <div class="col-slot" data-slot="right-0">
            <article class="card right-card" data-card="right-0">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w70 anim grow-x" data-step="col-right-inner"></div>
                <div class="line w50 anim grow-x" data-step="col-right-inner"></div>
              </div>
              <div class="avatar-row">
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
                <div class="avatar-sm anim pop" data-step="col-right-bits"></div>
              </div>
            </article>
          </div>
          <div class="col-slot" data-slot="right-1">
            <article class="card right-card" data-card="right-1">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w60 anim grow-x" data-step="col-right-inner"></div>
                <div class="line thick w100 anim grow-x" data-step="col-right-inner"></div>
              </div>
            </article>
          </div>
          <div class="col-slot" data-slot="right-2">
            <article class="card right-card" data-card="right-2">
              <div class="card-head">
                <div class="label-pill anim pop" data-step="col-right-inner"></div>
                <div class="icon-circle anim pop" data-step="col-right-inner"></div>
              </div>
              <div class="lines">
                <div class="line w80 anim grow-x" data-step="col-right-inner"></div>
                <div class="line anim grow-x" data-step="col-right-inner" style="width:45%"></div>
              </div>
              <div class="stack-icon anim pop" data-step="col-right-bits">
                <span></span><span></span><span></span>
              </div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="replay" id="replay" type="button">Replay</button>

  <script>
    const dashboard = document.getElementById("dashboard");
    const grid = document.getElementById("grid");
    const stage = document.getElementById("stage");
    const sizeLabel = document.getElementById("sizeLabel");
    const replayBtn = document.getElementById("replay");
    const endTitle = document.getElementById("endTitle");
    const endHeadline = document.getElementById("endHeadline");
    const grayVeil = document.getElementById("grayVeil");
    const SHIFT_MS = 700;
    const GROW_MS = 750;
    const MORPH_MS = 850;
    const HOLD_MS = 800;
    const CLOSING_TEXT = "What are you working on?";

    const SIZES = {
      big: { width: 920, label: "Desktop" },
      mid: { width: 680, label: "Tablet" },
      small: { width: 360, label: "Mobile" },
    };

    // big → mid → small → mid → big
    const MORPH_SEQUENCE = ["big", "mid", "small", "mid", "big"];

    let timers = [];
    let flipRaf = 0;
    let morphing = false;

    function buildHeadline() {
      endHeadline.textContent = "";
      [...CLOSING_TEXT].forEach((ch) => {
        const span = document.createElement("span");
        span.className = ch === " " ? "char space" : "char";
        span.textContent = ch === " " ? "\u00a0" : ch;
        endHeadline.appendChild(span);
      });
    }

    buildHeadline();

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
      cancelAnimationFrame(flipRaf);
    }

    function wait(ms) {
      return new Promise((resolve) => {
        const id = setTimeout(resolve, ms);
        timers.push(id);
      });
    }

    function measureCards() {
      const map = new Map();
      document.querySelectorAll(".card.is-grown").forEach((el) => {
        map.set(el, el.getBoundingClientRect());
      });
      return map;
    }

    function flipFrom(firstRects, duration = SHIFT_MS) {
      const lasts = measureCards();
      const playing = [];

      lasts.forEach((last, el) => {
        const first = firstRects.get(el);
        if (!first) return;

        const dx = first.left - last.left;
        const dy = first.top - last.top;
        const sx = first.width / Math.max(last.width, 1);
        const sy = first.height / Math.max(last.height, 1);

        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 &&
            Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) {
          return;
        }

        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
        playing.push(el);
      });

      void grid.offsetWidth;

      playing.forEach((el) => {
        el.style.transition =
          `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1)`;
        el.style.transform = "translate(0, 0) scale(1)";
      });

      const cleanup = setTimeout(() => {
        playing.forEach((el) => {
          el.style.transition = "";
          el.style.transform = "";
        });
      }, duration + 40);
      timers.push(cleanup);
    }

    async function growCard(slotSelector, { delay = 0 } = {}) {
      if (delay) await wait(delay);

      const slot = document.querySelector(slotSelector);
      const card = slot.querySelector(".card");
      const first = measureCards();

      slot.classList.add("is-open");
      await new Promise((r) => {
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => {
            card.classList.add("is-grown");
            flipFrom(first);
            r();
          });
        });
      });

      await wait(GROW_MS * 0.55);
    }

    async function showColumn(name, { delay = 0 } = {}) {
      if (delay) await wait(delay);
      const first = measureCards();
      grid.classList.add(`show-${name}`);
      if (name === "left") dashboard.classList.add("has-left");

      await new Promise((r) => {
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => {
            flipFrom(first);
            r();
          });
        });
      });

      await wait(SHIFT_MS * 0.45);
    }

    async function revealStep(step, stagger = 0) {
      const nodes = [...document.querySelectorAll(`[data-step="${step}"]`)];
      for (let i = 0; i < nodes.length; i++) {
        nodes[i].classList.add("is-in");
        if (stagger && i < nodes.length - 1) await wait(stagger);
      }
    }

    function cappedWidth(target) {
      const max = document.documentElement.clientWidth - 32;
      return Math.min(target, Math.max(280, max));
    }

    function showSizeLabel(text) {
      sizeLabel.textContent = text;
      sizeLabel.classList.add("visible");
    }

    function hideSizeLabel() {
      sizeLabel.classList.remove("visible");
    }

    /**
     * Shrink/grow the stage width and switch layout (big/mid/small).
     * Width eases via CSS; cards FLIP into the new arrangement.
     */
    async function setStageSize(key, { duration = MORPH_MS } = {}) {
      const { width, label } = SIZES[key];
      const next = cappedWidth(width);
      showSizeLabel(label);

      const first = measureCards();

      stage.dataset.size = key;
      stage.style.width = `${next}px`;
      dashboard.scrollTop = 0;

      await new Promise((r) => {
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => {
            flipFrom(first, duration);
            r();
          });
        });
      });

      await wait(duration);

      // On compact layouts, scroll overflow into view then back
      if (key === "mid" || key === "small") {
        await peekOverflow();
      } else {
        dashboard.scrollTop = 0;
      }
    }

    /** Smoothly scroll the locked frame to reveal overflow, then return */
    function animateScroll(el, to, duration) {
      const from = el.scrollTop;
      const delta = to - from;
      if (Math.abs(delta) < 2) return Promise.resolve();

      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          el.scrollTop = from + delta * eased;
          if (t < 1) {
            const id = requestAnimationFrame(frame);
            // track via timers cleanup by storing cancel on clearTimers — use wait pattern
            flipRaf = id;
          } else {
            resolve();
          }
        }
        flipRaf = requestAnimationFrame(frame);
      });
    }

    async function peekOverflow() {
      const max = dashboard.scrollHeight - dashboard.clientHeight;
      if (max <= 12) return;

      await wait(200);
      await animateScroll(dashboard, max, 700);
      await wait(450);
      await animateScroll(dashboard, 0, 700);
    }

    function lockFrameHeight() {
      // Capture desktop frame height so mid/small never grow the outer shell
      dashboard.classList.remove("is-locked");
      dashboard.style.removeProperty("--frame-h");
      void dashboard.offsetHeight;
      const h = Math.ceil(dashboard.getBoundingClientRect().height);
      dashboard.style.setProperty("--frame-h", `${h}px`);
      dashboard.classList.add("is-locked");
      dashboard.scrollTop = 0;
    }

    /** After build-up: big → mid → small → mid → big */
    async function morphViewportCycle() {
      morphing = true;
      stage.classList.add("is-morphing");
      stage.dataset.size = "big";
      stage.style.width = `${cappedWidth(SIZES.big.width)}px`;
      lockFrameHeight();
      showSizeLabel(SIZES.big.label);
      await wait(500);

      for (let i = 1; i < MORPH_SEQUENCE.length; i++) {
        await setStageSize(MORPH_SEQUENCE[i]);
        await wait(HOLD_MS);
      }

      await wait(350);
      hideSizeLabel();
      stage.classList.remove("is-morphing");
      morphing = false;
    }

    function resetStageWidth() {
      stage.style.width = "";
      stage.dataset.size = "big";
      dashboard.classList.remove("is-locked");
      dashboard.style.removeProperty("--frame-h");
      dashboard.scrollTop = 0;
      hideSizeLabel();
      stage.classList.remove("is-morphing");
      morphing = false;
    }

    function sizeFromViewport() {
      const w = window.innerWidth;
      if (w <= 540) return "small";
      if (w <= 720) return "mid";
      return "big";
    }

    async function revealClosingText() {
      endTitle.classList.add("is-in");
      endTitle.setAttribute("aria-hidden", "false");
      const chars = [...endHeadline.querySelectorAll(".char")];
      for (let i = 0; i < chars.length; i++) {
        chars[i].classList.add("is-in");
        await wait(28);
      }
    }

    /** UI collapses into the question and holds */
    async function closingAnimation() {
      hideSizeLabel();
      await wait(280);

      // Dashboard shrinks / blurs toward center
      dashboard.classList.add("is-closing");
      stage.classList.add("is-closing");
      await wait(380);

      // Letters assemble as the UI dissolves — hold on the question
      await revealClosingText();
      await wait(600);
    }

    function resetClosing() {
      dashboard.classList.remove("is-closing");
      stage.classList.remove("is-closing");
      endTitle.classList.remove("is-in", "to-gray");
      endTitle.setAttribute("aria-hidden", "true");
      endHeadline.querySelectorAll(".char").forEach((c) => c.classList.remove("is-in"));
      grayVeil.classList.remove("is-in");
      document.body.classList.remove("is-gray");
    }

    function reset() {
      clearTimers();
      resetStageWidth();
      resetClosing();
      dashboard.classList.remove("is-in", "has-left");
      grid.classList.remove("show-left", "show-mid", "show-right");
      document.querySelectorAll(".col-slot").forEach((el) => el.classList.remove("is-open"));
      document.querySelectorAll(".card").forEach((el) => {
        el.classList.remove("is-grown");
        el.style.transition = "";
        el.style.transform = "";
      });
      document.querySelectorAll(".anim, .tab, .feature-inner, .feature-footer, .toggle-panel")
        .forEach((el) => el.classList.remove("is-in"));
      replayBtn.classList.remove("visible");
    }

    async function play() {
      reset();
      await wait(60);

      // Build at desktop size
      stage.dataset.size = "big";
      stage.style.width = `${cappedWidth(SIZES.big.width)}px`;

      dashboard.classList.add("is-in");
      await wait(420);

      await revealStep("header", 65);
      await wait(100);
      await revealStep("header-inner", 40);
      await wait(220);

      await revealStep("tabs", 70);
      await wait(280);

      await showColumn("left");
      await growCard('[data-slot="left-0"]');
      await wait(120);
      await revealStep("col-left-inner");
      await wait(140);
      await revealStep("col-left-bits", 55);
      await wait(220);

      await showColumn("mid");
      await growCard('[data-slot="mid-0"]');
      await wait(80);
      await growCard('[data-slot="mid-1"]');
      await wait(100);
      await revealStep("col-mid-inner", 40);
      await wait(100);
      await revealStep("col-mid-bits", 45);
      await wait(200);

      await showColumn("right");
      await growCard('[data-slot="right-0"]');
      await growCard('[data-slot="right-1"]', { delay: 70 });
      await growCard('[data-slot="right-2"]', { delay: 70 });
      await wait(100);
      await revealStep("col-right-inner", 35);
      await wait(90);
      await revealStep("col-right-bits", 40);

      await wait(600);

      // Responsive morph: big → middle → small → middle → big
      await morphViewportCycle();

      await wait(400);

      // Closing: transform into question → gray screen
      await closingAnimation();

      await wait(200);
      replayBtn.classList.add("visible");
    }

    replayBtn.addEventListener("click", play);

    /* Keep layout in sync with real viewport when not morphing */
    let resizeTimer = 0;
    let lastWidth = window.innerWidth;

    window.addEventListener("resize", () => {
      if (morphing) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const width = window.innerWidth;
        if (Math.abs(width - lastWidth) < 2) return;
        const first = measureCards();
        lastWidth = width;

        const nextSize = sizeFromViewport();
        stage.dataset.size = nextSize;
        stage.style.width = `${cappedWidth(SIZES[nextSize].width)}px`;

        cancelAnimationFrame(flipRaf);
        flipRaf = requestAnimationFrame(() => {
          flipRaf = requestAnimationFrame(() => flipFrom(first));
        });
      }, 40);
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", play);
    } else {
      play();
    }
  </script>
</body>
</html>
